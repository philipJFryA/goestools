name: Build and Publish Multi-Platform Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    strategy:
      matrix:
        feature: [goesrecv, goesproc]
        platform: [linux/amd64, linux/arm64]
      fail-fast: false
    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ matrix.feature }}
          tags: |
            type=raw,value=latest-${{ matrix.platform }},enable={{is_default_branch}}
            type=raw,value=${{ matrix.platform }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.feature }}
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            version=latest
            TARGETPLATFORM=${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.feature }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.feature }}-${{ matrix.platform }},mode=max
          provenance: mode=min

  create-manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          for feature in goesrecv goesproc; do
            docker manifest create ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${feature}:latest \
              --amend ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${feature}:latest-linux/amd64 \
              --amend ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${feature}:latest-linux/arm64
            
            docker manifest push ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${feature}:latest
          done
